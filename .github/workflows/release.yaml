name: Progressive Delivery Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release-canary:
    name: Build & Trigger Argo Rollout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Release Tag
        id: vars
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: apps/payment-service
          file: apps/payment-service/Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/payment-service:${{ steps.vars.outputs.TAG }}

      - name: Update Rollout Manifest (GitOps)
        run: |
          sed -i 's|image: payment-service:.*|image: payment-service:${{ steps.vars.outputs.TAG }}|g' apps/payment-service/manifests/rollout.yaml
          echo "Rollout manifest updated for progressive canary release: ${{ steps.vars.outputs.TAG }}"
