
name: CloudDrop Build and Test

on:
  push:
    branches: [main]
    paths:
      - "apps/fileshare/**"
      - ".github/workflows/build-and-test.yaml"

  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/fileshare/backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/fileshare/backend

      - name: Run backend tests
        run: npm test --prefix apps/fileshare/backend

      - name: Security audit
        run: npm audit --prefix apps/fileshare/backend --audit-level=high

      - name: Build Docker image
        run: |
          docker build \
            -t clouddrop-service:ci \
            -f apps/fileshare/Dockerfile \
            apps/fileshare
