apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: payment-gateway
  namespace: prod
spec:
  selector:
    istio: ingress
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: payment-virtualservice
  namespace: prod
spec:
  hosts:
  - "*"
  gateways:
  - payment-gateway
  http:
  - name: primary
    route:
    - destination:
        host: payment-service-stable
        port:
          number: 8080
      weight: 100
    - destination:
        host: payment-service-canary
        port:
          number: 8080
      weight: 0
