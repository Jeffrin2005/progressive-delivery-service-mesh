apiVersion: v1
kind: Service
metadata:
  name: payment-service-stable
  namespace: prod
  labels:
    app: payment-service
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: payment-service
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service-canary
  namespace: prod
  labels:
    app: payment-service
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: payment-service
