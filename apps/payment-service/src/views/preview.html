<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Download {{FILE_NAME}} - CloudDrop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen text-slate-100 flex flex-col items-center justify-center p-4 selection:bg-blue-500 selection:text-white" style="background: {{BG_GRADIENT}};">
  
  <div class="w-full max-w-lg bg-slate-900/95 backdrop-blur-xl border border-white/10 rounded-2xl p-8 shadow-2xl relative">
    
    <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
      <div class="flex items-center gap-2">
        <span class="text-xl">📁</span>
        <span class="font-bold text-sm tracking-wide text-white">CloudDrop Shared File</span>
      </div>
      <span class="px-2.5 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider text-white" style="background-color: {{PRIMARY_COLOR}};">
        {{VERSION_BADGE}}
      </span>
    </div>

    <!-- Preview Container -->
    <div class="text-center my-4">
      {{PREVIEW_CONTENT}}

      <h2 class="text-xl font-bold text-white break-words mt-3">{{FILE_NAME}}</h2>
      <p class="text-xs text-slate-400 mt-1">Size: <span class="text-slate-200 font-semibold">{{FILE_SIZE}}</span></p>
    </div>

    <!-- Big Download Button -->
    <div class="mt-6 flex flex-col gap-3">
      <a href="/download/raw/{{FILE_ID}}" download="{{FILE_NAME}}" class="w-full py-3.5 rounded-xl font-bold text-sm text-white text-center shadow-lg transition-all hover:brightness-110 flex items-center justify-center gap-2" style="background-color: {{PRIMARY_COLOR}};">
        <span>📥</span>
        <span>Download File ({{FILE_SIZE}})</span>
      </a>

      <a href="/" class="text-center text-xs text-slate-400 hover:text-white transition-colors mt-2">
        ← Upload another file
      </a>
    </div>

    <!-- Telemetry -->
    <div class="mt-6 pt-4 border-t border-slate-800 flex justify-between text-[11px] font-mono text-slate-500">
      <span>Delivered by: <b>{{HOSTNAME}}</b></span>
      <span>Mesh Route: <b style="color:{{PRIMARY_COLOR}};">{{TRAFFIC_SHARE}}</b></span>
    </div>
  </div>

</body>
</html>
