apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: clouddrop-destinationrule
  namespace: prod
spec:
  host: clouddrop-service-stable
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL # Zero-Trust automatic mTLS encryption between all pods
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: clouddrop-destinationrule-canary
  namespace: prod
spec:
  host: clouddrop-service-canary
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL # Zero-Trust automatic mTLS encryption
