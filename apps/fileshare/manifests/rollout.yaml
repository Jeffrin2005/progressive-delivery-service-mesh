
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: clouddrop-service
  namespace: prod
  labels:
    app: clouddrop-service

spec:
  replicas: 4
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: clouddrop-service

  template:
    metadata:
      labels:
        app: clouddrop-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"

    spec:
      securityContext:
        fsGroup: 1000

      volumes:
        - name: shared-storage-vol
          persistentVolumeClaim:
            claimName: clouddrop-files

      containers:
        - name: clouddrop-service
          image: clouddrop-service:v1.0.0
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          ports:
            - name: http
              containerPort: 8080

          volumeMounts:
            - name: shared-storage-vol
              mountPath: /tmp/shared-files

          env:
            - name: APP_VERSION
              value: "v1.0.0"
            - name: RELEASE_COLOR
              value: "#3b82f6"
            - name: INITIAL_ERROR_PERCENTAGE
              value: "0"
            - name: STORAGE_PATH
              value: "/tmp/shared-files"

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

  strategy:
    canary:
      stableService: clouddrop-service-stable
      canaryService: clouddrop-service-canary

      trafficRouting:
        istio:
          virtualService:
            name: clouddrop-virtualservice
            routes:
              - primary

      steps:
        - setWeight: 20
        - pause:
            duration: 30s
        - analysis:
            templates:
              - templateName: clouddrop-success-rate
            args:
              - name: service-version
                value: "v2.0.0-canary"

        - setWeight: 50
        - pause:
            duration: 30s
        - analysis:
            templates:
              - templateName: clouddrop-success-rate
            args:
              - name: service-version
                value: "v2.0.0-canary"
