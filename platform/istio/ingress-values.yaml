# Production Helm values for Istio Ingress Gateway
service:
  type: NodePort
  ports:
  - name: status-port
    port: 15021
    targetPort: 15021
    nodePort: 30021
    protocol: TCP
  - name: http2
    port: 80
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8443
    nodePort: 30443
    protocol: TCP
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
