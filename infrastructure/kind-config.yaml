kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: progressive-delivery
nodes:
- role: control-plane
  extraPortMappings:
  # Map host port 80 to container port 30080 (for HTTP Istio Ingress)
  - containerPort: 30080
    hostPort: 80
    protocol: TCP
  # Map host port 443 to container port 30443 (for HTTPS Istio Ingress)
  - containerPort: 30443
    hostPort: 443
    protocol: TCP
  # Map host port 8080 to container port 30081 (Alternative / Dev test port)
  - containerPort: 30081
    hostPort: 8080
    protocol: TCP
